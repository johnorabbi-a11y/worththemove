name: Apply verified pre-indexing QA
on:
  push:
    paths:
      - '.github/workflows/import-qa.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack checked release
        run: |
          echo 'ebc24608e082687781272bcade21a4a21f957fd3e1fa04d835616173a0e50261  worththemove-qa.zip' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          with ZipFile('worththemove-qa.zip') as z:
              for entry in z.infolist():
                  target = (root / entry.filename).resolve()
                  if not target.is_relative_to(root) or '.git' in Path(entry.filename).parts:
                      raise ValueError(entry.filename)
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(entry).replace(b'\r\n', b'\n'))
          Path('worththemove-qa.zip').unlink()
          Path('.github/workflows/import-qa.yml').unlink()
          PY
      - name: Verify financial tests and static site
        run: |
          node --test tests/*.test.mjs
          node scripts/check.mjs
      - name: Commit exact verified tree to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git write-tree)" = 'd035fd2b58f60b59fab4393dd17d966804e8d279'
          git commit -m 'Fix pre-indexing calculation edge cases and verify all 54 pages'
          git push origin HEAD:main
      - name: Independently check custom-domain HTTPS
        continue-on-error: true
        run: curl --fail --head --max-time 25 https://worththemove.co.uk/
