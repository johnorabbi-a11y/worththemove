name: Import checked V1 release
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-v1.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore the checked website
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('worththemove-v1.zip')
          expected = '47ed83834092c466460aa6dee5220d1c55aed67c5630d8467507608387db1d4b'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Release checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              z.extractall('.')
          archive.unlink()
          pathlib.Path('.github/workflows/import-v1.yml').unlink()
          PY
          node --test tests/engine.test.mjs
          node scripts/check.mjs
          git config core.autocrlf false
          git add -A
          test "$(git write-tree)" = "740ba5fc768d982c108a2559157bf3f8b1b133b4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish checked Worth The Move V1: 54 pages and 16 calculators"
          git push origin HEAD:main
